spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:elinktest;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  rate-limit:
    auth-per-minute: 1000
  seed:
    enabled: true
